name: Oracle Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".devcontainer/**"
      - "src/**"
      - "examples/proxy_wrapper_smoke/**"
      - "scripts/run_proxy_wrapper_smoke.sh"
      - ".github/workflows/oracle-integration.yml"

jobs:
  oracle-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Oracle smoke test in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          runCmd: |
            export ORANIF_REPO_URL=https://github.com/ahjulstad/oranif.git
            export ORANIF_REPO_REF=master
            export ORANIF_FORK_DIR=/tmp/oranif_fork
            export ORANIF_ODPI_TAG=v5.6.4
            export ORANIF_LINK_ODPI=true
            gleam format --check src test
            gleam test
            ./scripts/run_proxy_wrapper_smoke.sh
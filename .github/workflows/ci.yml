name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-format:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/base:bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Root package format check
        run: gleam format --check src test

      - name: Root package build
        run: gleam build

      - name: Root package tests
        run: gleam test

      - name: Example format check
        working-directory: examples/proxy_wrapper_smoke
        run: gleam format --check src

      - name: Example build
        working-directory: examples/proxy_wrapper_smoke
        run: gleam build
